<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORBITAL — updating</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b16;color:#cfe3ff;font:16px system-ui,sans-serif}</style>
</head><body><p id="m">Updating ORBITAL to the latest version…</p>
<script>
// Removes the old offline cache/service worker (your mission data in the database is kept) and reopens the app.
(async () => {
  try { for (const r of await navigator.serviceWorker?.getRegistrations?.() || []) await r.unregister(); } catch (e) {}
  try { for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
  location.replace('./?v=' + Date.now());
})();
</script></body></html>
